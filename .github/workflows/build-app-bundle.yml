# scConvertShiny app-layer bundle builder.
# Standard path: .github/workflows/build-app-bundle.yml (migrated from the
# legacy per-app filename; apps/scconvert keeps the old path as provenance).
# Build-toolchain deviation: this app still installs with setup-r's framework R
# (the v5 template uses portable R). Revalidate the macOS bundle on a clean Mac
# before publishing; migrating to portable R is a separate change.
#
# Produces, per platform:  scconvert-<version>-<platform>-r<abi>.zip
#   bundle/ +- manifest.json +- app/app.R +- rlib/<Pkg>/
# Strict v5 artifact format: r<abi> suffix, manifest r_abi, deps-<platform>.json,
# meta-<platform>.json and a consolidated build-info.json.
#
# scConvert and scConvertShiny are built with R CMD build, then installed into
# bundle/rlib. scConvert is cloned from mianaz/scConvert at SCCONVERT_REF
# (default main); its commit/version are recorded in meta-*.json/build-info.json.
# macOS provides HDF5 for scConvert's configure.
#
# Release rules follow shinyapps-onboarding v5.5: a v* tag push is the only
# automatic trigger; a resolve job canonicalizes/validates the tag; a manual
# run only attaches to the tag's existing Release and never creates one.
# To retry a failed first build, re-run the original tag-push run (it keeps
# event=push and may create the Release); a manual dispatch will not.
# Push tags with git. A tag created through the Release UI may not emit a
# push event; in that case run this workflow manually against the Release.

name: Build app bundle

# Do NOT add `release: published`: this workflow creates the Release for a new
# tag, so that event would start a second identical build/upload.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose Release should receive the bundles (e.g. v0.1.4)"
        required: true
        type: string

permissions:
  contents: read

env:
  APP_ID: scconvert
  APP_NAME: scConvertShiny
  APP_AUTHOR: "Zhang Yongchao"
  APP_DESC: "Convert single-cell formats (h5ad / h5Seurat / loom / MuData)"
  APP_HOMEPAGE: "https://github.com/fentouxungui/scConvertShiny"
  APP_LICENSE: "MIT"
  R_VERSION: "4.6.1"
  # main = latest development; set a tag (e.g. v0.3.0) for a reproducible build.
  SCCONVERT_REF: "main"
  # on = start the built bundle and request / before uploading; off = skip.
  SMOKE: "on"
  SMOKE_TIMEOUT_SEC: "300"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate target tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-$EVENT_TAG}"
          raw="${raw#refs/tags/}"
          raw="${raw#v}"
          raw="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$raw" ]; then
            echo "::error::cannot resolve tag: pass a tag input or push a v* tag"
            exit 1
          fi

          tag="v$raw"
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag does not exist in this checkout"
            echo "fetched tags: $(git tag -l 'v*' | tr '\n' ' ')"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag version=$raw"

  bundle:
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: "win-x64" }
          - { os: macos-15,       platform: "mac-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the resolved tag, never the default branch.
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install build helpers
        shell: bash
        run: Rscript -e 'install.packages(c("jsonlite","zip","digest","BiocManager","callr","curl","httpuv"), repos="https://cloud.r-project.org")'

      - name: Provide HDF5 (macOS)
        if: matrix.platform == 'mac-arm64'
        run: |
          brew install hdf5 pkg-config
          H5="$(brew --prefix hdf5)"
          echo "PKG_CONFIG_PATH=$H5/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "HDF5_CFLAGS=-I$H5/include" >> "$GITHUB_ENV"
          echo "HDF5_LIBS=-L$H5/lib -lhdf5" >> "$GITHUB_ENV"

      - name: Use the resolved tag and version
        shell: bash
        env:
          RESOLVED_TAG: ${{ needs.resolve.outputs.tag }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          : "${RESOLVED_TAG:?}" "${RESOLVED_VERSION:?}"
          echo "VERSION=$RESOLVED_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$RESOLVED_TAG" >> "$GITHUB_ENV"
          # Record the checked-out tag commit, not the workflow ref.
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=refs/tags/$RESOLVED_TAG" >> "$GITHUB_ENV"

      - name: Build scConvertShiny + scConvert source tarballs
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          git clone --depth 1 --branch "${SCCONVERT_REF}" https://github.com/mianaz/scConvert.git scConvert-src
          SCCONVERT_COMMIT="$(git -C scConvert-src rev-parse HEAD)"
          SCCONVERT_VERSION="$(sed -n 's/^Version:[[:space:]]*//p' scConvert-src/DESCRIPTION | head -n1)"
          echo "SCCONVERT_COMMIT=$SCCONVERT_COMMIT" >> "$GITHUB_ENV"
          echo "SCCONVERT_VERSION=$SCCONVERT_VERSION" >> "$GITHUB_ENV"
          echo "scConvert ${SCCONVERT_VERSION} @ ${SCCONVERT_COMMIT}"
          R CMD build --no-build-vignettes --no-manual scConvert-src
          ls -1 *.tar.gz

      - name: Install app + dependency closure into bundle/rlib
        shell: Rscript {0}
        run: |
          bundle <- file.path(getwd(), "bundle")
          unlink(bundle, recursive = TRUE); dir.create(bundle, recursive = TRUE)
          lib <- file.path(bundle, "rlib"); dir.create(lib, recursive = TRUE)
          repos <- BiocManager::repositories()
          options(repos = repos)

          tb <- list.files(".", pattern = sprintf("^scConvertShiny_%s[.]tar[.]gz$", Sys.getenv("VERSION")), full.names = TRUE)
          if (!length(tb)) {
            built <- list.files(".", pattern = "^scConvertShiny_[0-9].*[.]tar[.]gz$")
            stop(sprintf(
              "scConvertShiny_%s.tar.gz not found (built: %s) -- bump DESCRIPTION Version to match the tag (version mismatch)",
              Sys.getenv("VERSION"), paste(built, collapse = ", ")))
          }
          local_extra <- list.files(".", pattern = "^scConvert_[0-9].*[.]tar[.]gz$", full.names = TRUE)
          local_paths <- normalizePath(c(tb, local_extra), winslash = "/", mustWork = TRUE)

          read_desc <- function(p) {
            td <- tempfile(); dir.create(td)
            utils::untar(p, exdir = td)
            dd <- list.files(td, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)[1]
            read.dcf(dd)
          }
          dcfs <- lapply(local_paths, read_desc)
          loc_names <- vapply(dcfs, function(d) d[1, "Package"], character(1))
          writeLines(loc_names, file.path(getwd(), "local-pkgs.txt"))
          declared <- unique(unlist(lapply(dcfs, function(d) {
            fields <- intersect(c("Depends", "Imports", "LinkingTo"), colnames(d))
            vals <- unlist(lapply(fields, function(f) if (is.na(d[1, f])) "" else d[1, f]))
            parts <- trimws(unlist(strsplit(paste(vals, collapse = ","), ",")))
            parts <- trimws(sub("\\(.*\\)$", "", parts))
            parts[nzchar(parts) & parts != "R"]
          })))

          db <- available.packages(repos = repos)
          # Full transitive closure over BOTH the local names and their declared
          # deps. GitHub-only packages (scConvert, scConvertShiny) are absent from
          # `db`, so their deps come from `declared` and must be expanded here --
          # otherwise transitive deps (e.g. RANN via Seurat) are missed.
          seed <- unique(c(loc_names, declared))
          closure <- unique(c(unlist(tools::package_dependencies(seed, db = db, recursive = TRUE)), declared))
          # Base and recommended packages belong to the shell's bundled R. Never
          # ship them in rlib: on macOS a copy built against the runner's
          # R.framework can fail on users' Macs. Other packages installed by the
          # build-helper step (jsonlite/zip/digest/BiocManager) stay available to
          # the app and must not be dropped from the closure.
          runtime_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
          closure <- setdiff(closure, c(loc_names, runtime_pkgs, basename(list.dirs(lib, recursive = FALSE))))
          if (length(closure)) {
            install.packages(closure, lib = lib, repos = repos, type = "binary",
                             dependencies = FALSE, Ncpus = 2)
          }
          install.packages(local_paths, lib = lib, repos = NULL, type = "source", dependencies = FALSE)

          missing <- setdiff(loc_names, basename(list.dirs(lib, recursive = FALSE)))
          if (length(missing)) stop("local packages not installed: ", paste(missing, collapse = ", "))
          bad_runtime <- intersect(basename(list.dirs(lib, recursive = FALSE)), runtime_pkgs)
          if (length(bad_runtime)) {
            stop("rlib contains base/recommended packages: ", paste(bad_runtime, collapse = ", "),
                 ". The shell's bundled R provides them.")
          }
          cat("rlib packages:", length(list.dirs(lib, recursive = FALSE)), "\n")

      - name: Assemble app + manifest.json
        shell: Rscript {0}
        run: |
          bundle <- file.path(getwd(), "bundle")
          lib <- file.path(bundle, "rlib")
          dir.create(file.path(bundle, "app"), recursive = TRUE, showWarnings = FALSE)
          writeLines(c(
            'library(scConvertShiny)',
            'options(shiny.launch.browser = FALSE, shiny.deprecation.messages = FALSE)',
            'sc_app()'
          ), file.path(bundle, "app", "app.R"))

          pkgs <- as.data.frame(installed.packages(lib.loc = lib))
          r_version <- paste(R.version$major, R.version$minor, sep = ".")
          r_abi <- paste(R.version$major, sub("\\..*$", "", R.version$minor), sep = ".")
          if (!identical(r_version, Sys.getenv("R_VERSION"))) {
            stop("R_VERSION says ", Sys.getenv("R_VERSION"), " but this R is ", r_version)
          }
          local_pkgs <- if (file.exists("local-pkgs.txt")) readLines("local-pkgs.txt", warn = FALSE) else character()
          man <- list(
            schema = 1L,
            id = Sys.getenv("APP_ID"), name = Sys.getenv("APP_NAME"), version = Sys.getenv("VERSION"),
            author = Sys.getenv("APP_AUTHOR"), description = Sys.getenv("APP_DESC"),
            homepage = Sys.getenv("APP_HOMEPAGE"), license = Sys.getenv("APP_LICENSE"),
            runtime = "r-shiny", entry = "app/app.R",
            platform = "${{ matrix.platform }}",
            r_version = r_version, r_abi = r_abi, min_shell_version = "0.1.0",
            source_repository = Sys.getenv("GITHUB_REPOSITORY"),
            source_commit = Sys.getenv("SOURCE_COMMIT"), source_ref = Sys.getenv("SOURCE_REF"),
            source_tag = Sys.getenv("TAG"),
            notes = "Windows: scConvert conversion relies on hdf5r; the CRAN Windows hdf5r bundles HDF5 1.12.x whose H5Fclose can fail at GC (documented scConvert limitation). Tracked separately.",
            packages = lapply(seq_len(nrow(pkgs)), function(i) list(
              name = pkgs$Package[i], version = pkgs$Version[i],
              path = file.path("rlib", pkgs$Package[i]),
              source = if (pkgs$Package[i] %in% local_pkgs) "local" else "cran"))
          )
          jsonlite::write_json(man, file.path(bundle, "manifest.json"), pretty = TRUE, auto_unbox = TRUE)

      - name: Zip + sha256 + metadata
        shell: Rscript {0}
        run: |
          root <- getwd()
          platform <- "${{ matrix.platform }}"
          r_version <- Sys.getenv("R_VERSION")
          actual_r <- paste(R.version$major, R.version$minor, sep = ".")
          if (!identical(actual_r, r_version)) {
            stop("R_VERSION says ", r_version, " but this R is ", actual_r)
          }
          r_abi <- paste(head(strsplit(r_version, ".", fixed = TRUE)[[1]], 2), collapse = ".")
          out <- sprintf("%s-%s-%s-r%s.zip", Sys.getenv("APP_ID"), Sys.getenv("VERSION"), platform, r_abi)

          bundle <- file.path(root, "bundle")
          lib <- file.path(bundle, "rlib")
          pkgs <- as.data.frame(installed.packages(lib.loc = lib), stringsAsFactors = FALSE)
          lock <- data.frame(package = pkgs$Package, version = pkgs$Version, stringsAsFactors = FALSE)
          lock <- lock[order(lock$package), ]
          lock_file <- sprintf("deps-%s.json", platform)
          jsonlite::write_json(lock, file.path(root, lock_file), pretty = TRUE, auto_unbox = TRUE)
          lock_sha <- digest::digest(file.path(root, lock_file), algo = "sha256", file = TRUE)

          old <- setwd(bundle); on.exit(setwd(old))
          zip::zipr(out, files = list.files(".", all.files = TRUE, no.. = TRUE))
          entries <- utils::unzip(out, list = TRUE)$Name
          if (!any(grepl("^rlib/", entries))) stop("zip is missing rlib/ -- aborting")
          if (!any(grepl("^app/(app[.]R|ui[.]R)$", entries))) stop("zip is missing app/app.R or app/ui.R -- aborting")
          setwd(old)
          file.rename(file.path(bundle, out), out)
          sha <- digest::digest(out, algo = "sha256", file = TRUE)
          sz <- file.size(out)
          cat("bundle zip size (bytes):", sz, "\n")

          meta <- list(
            schema = 1L, app_id = Sys.getenv("APP_ID"), platform = platform,
            version = Sys.getenv("VERSION"), file = out, sha256 = sha, size = sz,
            source_repository = Sys.getenv("GITHUB_REPOSITORY"),
            source_commit = Sys.getenv("SOURCE_COMMIT"), source_ref = Sys.getenv("SOURCE_REF"),
            source_tag = Sys.getenv("TAG"),
            r_version = r_version, r_abi = r_abi,
            scconvert_ref = Sys.getenv("SCCONVERT_REF"),
            scconvert_commit = Sys.getenv("SCCONVERT_COMMIT"),
            scconvert_version = Sys.getenv("SCCONVERT_VERSION"),
            cran_snapshot = "",
            strict_version = "on", strict_deps = "off", pandoc_version = NA_character_,
            dependency_lock = lock_file, dependency_lock_sha256 = lock_sha,
            package_count = nrow(pkgs)
          )
          jsonlite::write_json(meta, file.path(root, sprintf("meta-%s.json", platform)),
                               pretty = TRUE, auto_unbox = TRUE)

      - name: Smoke test (start the bundle with a clean library)
        if: ${{ env.SMOKE != 'off' }}
        timeout-minutes: 12
        shell: Rscript {0}
        run: |
          # Start the built bundle with only rlib + the runner's base R. This
          # catches startup/UI errors; it is not the installed ShinyApps shell E2E.
          serve <- function(appdir, lib, port) {
            .libPaths(c(lib, .Library))
            if (!identical(normalizePath(.libPaths()[1], winslash = "/", mustWork = TRUE),
                           normalizePath(lib, winslash = "/", mustWork = TRUE))) {
              stop("smoke: bundle rlib is not first on .libPaths()")
            }
            allowed <- normalizePath(c(lib, .Library), winslash = "/", mustWork = TRUE)
            actual <- normalizePath(.libPaths(), winslash = "/", mustWork = FALSE)
            extra <- setdiff(actual, allowed)
            if (length(extra)) stop("smoke: unexpected library paths: ", paste(extra, collapse = ", "))
            old <- setwd(appdir); on.exit(setwd(old), add = TRUE)
            shiny::runApp(".", port = port, host = "127.0.0.1",
                          launch.browser = FALSE, quiet = TRUE)
          }

          smoke <- function() {
            app_id <- Sys.getenv("APP_ID"); ver <- Sys.getenv("VERSION"); plat <- "${{ matrix.platform }}"
            r_version <- Sys.getenv("R_VERSION")
            r_abi <- paste(head(strsplit(r_version, ".", fixed = TRUE)[[1]], 2), collapse = ".")
            zip <- sprintf("%s-%s-%s-r%s.zip", app_id, ver, plat, r_abi)
            if (!file.exists(zip)) stop("smoke: bundle not found: ", zip)
            tmp <- tempfile("smoke"); dir.create(tmp)
            utils::unzip(zip, exdir = tmp)
            appdir <- file.path(tmp, "app"); lib <- file.path(tmp, "rlib")
            if (!dir.exists(appdir) || !dir.exists(lib)) stop("smoke: unexpected bundle layout")
            timeout <- suppressWarnings(as.integer(Sys.getenv("SMOKE_TIMEOUT_SEC", "300")))
            if (is.na(timeout) || timeout < 30) timeout <- 300

            port <- httpuv::randomPort()
            proc <- callr::r_bg(serve, args = list(appdir = appdir, lib = lib, port = port),
                                supervise = TRUE)
            on.exit(try(proc$kill(), silent = TRUE), add = TRUE)

            url <- sprintf("http://127.0.0.1:%d/", port)
            deadline <- Sys.time() + timeout
            out <- character()
            repeat {
              out <- c(out, proc$read_output_lines(), proc$read_error_lines())
              if (!proc$is_alive()) {
                cat(paste(out, collapse = "\n"), "\n")
                stop("smoke test FAILED: the app exited before serving a page")
              }
              served <- tryCatch({
                h <- curl::new_handle(connecttimeout = 5L, timeout = 10L)
                r <- curl::curl_fetch_memory(url, handle = h)
                r$status_code == 200L && length(r$content) > 0 &&
                  grepl("<!doctype|<html", rawToChar(r$content), ignore.case = TRUE)
              }, error = function(e) FALSE)
              if (isTRUE(served)) break
              if (Sys.time() >= deadline) {
                cat(paste(out, collapse = "\n"), "\n")
                stop("smoke test FAILED: ", url, " did not serve a page within ", timeout, "s")
              }
              Sys.sleep(1)
            }
            cat("SMOKE OK:", url, "served an HTML page\n")
          }
          smoke()

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            *.zip
            meta-*.json
            deps-*.json

  release:
    needs: [resolve, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, hashlib, json, os

          metas, deps = {}, {}
          for path in sorted(glob.glob("artifacts/meta-*.json")):
              platform = os.path.basename(path)[5:-5]
              metas[platform] = json.load(open(path))
          for path in sorted(glob.glob("artifacts/deps-*.json")):
              platform = os.path.basename(path)[5:-5]
              deps[platform] = json.load(open(path))
          if not metas:
              raise SystemExit("no meta-*.json artifacts found; refusing to publish")

          first = next(iter(metas.values()), {})
          info = {
              "app_id": first.get("app_id", ""),
              "version": first.get("version", ""),
              "source_repository": first.get("source_repository", ""),
              "source_commit": first.get("source_commit", ""),
              "scconvert_ref": first.get("scconvert_ref", ""),
              "scconvert_commit": first.get("scconvert_commit", ""),
              "scconvert_version": first.get("scconvert_version", ""),
              "generated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  platform: {"metadata": meta, "dependencies": deps.get(platform)}
                  for platform, meta in metas.items()
              },
          }
          with open("artifacts/build-info.json", "w") as fh:
              json.dump(info, fh, indent=2)
              fh.write("\n")

          lines = []
          for path in sorted(glob.glob("artifacts/*.zip")):
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              lines.append(f"{digest}  {os.path.basename(path)}")
          if not lines:
              raise SystemExit("no bundle zips found; refusing to publish an empty SHA256SUMS")
          with open("artifacts/SHA256SUMS", "w") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Attach bundles to the tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAG:?TAG is empty}"
          files=(artifacts/*.zip artifacts/SHA256SUMS artifacts/build-info.json)

          ERR="$(mktemp)"
          set +e
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets,databaseId 2>"$ERR")"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if grep -qiE 'release not found|HTTP 404' "$ERR"; then
              if [ "${EVENT_NAME:-}" != "push" ]; then
                echo "::error::No existing Release is associated with tag $TAG."
                echo "::error::Manual runs attach to an existing Release; they do not create one."
                exit 1
              fi
              echo "No Release exists for $TAG; creating one for the tag."
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --notes "Automated app bundle build for $TAG" \
                --verify-tag
              release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets,databaseId)"
            else
              echo "::error::could not read Release $TAG; refusing to guess"
              cat "$ERR"
              exit 1
            fi
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.databaseId')"
          existing="$(printf '%s' "$release_json" | jq -r '.assets[]?.name')"
          for f in "${files[@]}"; do
            n="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF "$n"; then
              echo "::error::release asset already exists for $TAG: $n"
              exit 1
            fi
          done

          echo "Attaching to existing Release $release_id for $TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"
